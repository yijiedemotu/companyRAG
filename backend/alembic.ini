# Alembic configuration.
#
# NOTE (important, real bug we hit): Alembic reads this file with the *system
# locale* encoding -- on a Chinese Windows box that is GBK, not UTF-8. Any
# non-ASCII character in this file therefore crashes with UnicodeDecodeError.
# Keep this file pure ASCII; put Chinese comments in alembic/env.py instead
# (Python source is always UTF-8).
#
# NOTE 2: sqlalchemy.url is intentionally EMPTY. The real URL is resolved by
# alembic/env.py from knowflow.core.config, so that:
#   - the password never lands in git,
#   - there is exactly ONE source of configuration truth.

[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os

# Timestamped revision filenames: sorting by name == chronological order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# NOTE 3: we deliberately do NOT configure a post_write_hooks ruff_format here.
# Alembic resolves console_scripts entry points from the running interpreter,
# and in this environment `ruff` has no registered entry point (only ruff.exe on
# disk), which makes `alembic revision` fail *after* writing the file -- a very
# confusing DX. Formatting is enforced by `make format` and CI instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
