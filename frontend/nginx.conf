# =====================================================================================
# KnowFlow 前端的 nginx 配置
#
# 三件事，每件都有踩坑背景：
#
#   1. **SPA fallback**：Vue Router 用的是 history 模式，用户刷新 /chat/3 时
#      nginx 会去找文件 `/chat/3`，找不到就 404。必须 `try_files ... /index.html`。
#
#   2. **/api 反代到后端**：让前端与 API 同源 —— 否则浏览器要处理跨域，
#      前端打包时还得知道后端地址（编译期注入环境变量，换环境要重新构建）。
#
#   3. **⭐ SSE 必须关闭 buffering**：这是本项目最容易踩的部署坑。
#      nginx 默认会缓冲上游响应（`proxy_buffering on`），
#      结果是"后端在逐字推、nginx 攒着一起发" ——
#      **流式效果完全消失**，用户要等整段答案生成完才看到内容。
#      必须 `proxy_buffering off` + 关掉 `proxy_cache` + 拉长 `proxy_read_timeout`
#      （长回答可能超过默认 60 秒）。
#      同时 `X-Accel-Buffering: no` 也由后端返回（双保险，见 api/routes/chat.py）。
# =====================================================================================

upstream knowflow_api {
    # docker compose 里后端服务名就是 backend；本地直接跑 nginx 时改成 127.0.0.1:8000
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip：JS/CSS 压缩比通常 3~4 倍（echarts 与 element-plus 是大头）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # 带 hash 的构建产物可以永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不能缓存，否则发版后用户拿到旧页面去请求已删除的 assets
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ---- 业务 API（SSE 走这里，所以必须关缓冲） ----
    location /api/ {
        proxy_pass http://knowflow_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ 流式输出的关键三行
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # SSE 用不上分块再压缩，且压缩会引入额外缓冲
        gzip off;
    }

    # ---- 运维探针（在根路径，不在 /api 下） ----
    location = /health  { proxy_pass http://knowflow_api/health;  proxy_read_timeout 10s; }
    location = /ready   { proxy_pass http://knowflow_api/ready;   proxy_read_timeout 10s; }
    location = /metrics { proxy_pass http://knowflow_api/metrics; proxy_read_timeout 10s; access_log off; }

    # ---- 上传体积：与后端 MAX_UPLOAD_MB 保持一致（默认 20MB） ----
    client_max_body_size 25m;

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏 nginx 版本号
    server_tokens off;
}
